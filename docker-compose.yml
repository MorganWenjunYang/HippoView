# =============================================================================
# HippoView local test stack
# =============================================================================
# `docker compose up --build` starts:
# - databases: MongoDB, Neo4j, Elasticsearch
# - main service: MCP RAG server
# - UI: Streamlit

x-hippoview-app: &hippoview-app
  image: hippoview-app:local
  build:
    context: .
    dockerfile: dockerfile
    args:
      PYTHON_BUILDER_IMAGE: ${PYTHON_BUILDER_IMAGE:-public.ecr.aws/docker/library/python:3.12}
      PYTHON_RUNTIME_IMAGE: ${PYTHON_RUNTIME_IMAGE:-public.ecr.aws/docker/library/python:3.12-slim}

x-hippoview-env: &hippoview-env
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DB: ${MONGO_DB:-clinical_trials}
  MONGO_USER: ${MONGO_USER:-admin}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-adminpassword}
  NEO4J_HOST: neo4j
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_USERNAME: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jpassword}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  ELASTICSEARCH_HOST: elasticsearch
  ELASTICSEARCH_PORT: "9200"
  ES_URL: http://elasticsearch:9200
  MCP_SERVER_URL: http://mcp_server:8000/mcp
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
  HUGGINGFACEHUB_API_TOKEN: ${HUGGINGFACEHUB_API_TOKEN:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  AACT_USER: ${AACT_USER:-}
  AACT_PWD: ${AACT_PWD:-}

services:
  mongodb:
    image: ${MONGODB_IMAGE:-public.ecr.aws/docker/library/mongo:7.0}
    container_name: hippoview-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-clinical_trials}
    volumes:
      - mongodb_data:/data/db
      - ./data:/data/import
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"${MONGO_USER:-admin}\" --password \"${MONGO_PASSWORD:-adminpassword}\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - hippoview_network
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-public.ecr.aws/docker/library/neo4j:5.15-community}
    container_name: hippoview-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./biocypher-out:/app/biocypher-out
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u \"${NEO4J_USER:-neo4j}\" -p \"${NEO4J_PASSWORD:-neo4jpassword}\" 'RETURN 1'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - hippoview_network
    restart: unless-stopped

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-public.ecr.aws/docker/library/elasticsearch:8.11.0}
    container_name: hippoview-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - hippoview_network
    restart: unless-stopped

  mcp_server:
    <<: *hippoview-app
    container_name: hippoview-mcp-server
    command: ["/app/entrypoints/mcp.sh"]
    environment:
      <<: *hippoview-env
    ports:
      - "${MCP_SERVER_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./biocypher-out:/app/biocypher-out
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8000), 5); s.close()\""
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - hippoview_network
    restart: unless-stopped

  streamlit:
    <<: *hippoview-app
    container_name: hippoview-streamlit
    command: ["/app/entrypoints/streamlit.sh"]
    environment:
      <<: *hippoview-env
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./logs:/app/logs
      - ./biocypher-out:/app/biocypher-out
    depends_on:
      mcp_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - hippoview_network
    restart: unless-stopped

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  elasticsearch_data:

networks:
  hippoview_network:
    driver: bridge
    name: hippoview_network
